name: pollen-prediction-daily

on:
  workflow_dispatch:
  # schedule:
  # - cron: '15 6 * * *'

jobs:
  schedule_pipelines:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: execute pollen prediction workflow
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          AQICN_API_KEY: "7cf03414cff83749c2d3891e437e8c68a85dfc1b"
          AQICN_COUNTRY: "sweden"
          AQICN_CITY: "Stockholm"
          AQICN_STREET: "dummy_street"
          AQICN_URL: "https://api.waqi.info/feed/@13987"
        run: |
          ipython pollen/2_grass_pollen_feature_pipeline.ipynb
          ipython pollen/3_grass_pollen_batch_inference.ipynb
      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add -A
          git commit -m "Update pollen predictions"
          git push
